# 两个服务：scanner（数据管道）+ api（报告服务）。
# 数据库为 SQLite 单文件（/data/autores.db），两容器共享同一 data 卷（同宿主机，
# WAL 模式支持 scanner 写 + api 读）。design.md D3 / §10.1。
services:
  scanner:
    build: .
    command: python -m autores.scanner.main
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - /mnt/nas/benchmark_root:/mnt/nas/benchmark_root:ro   # NAS 只读挂载
      - data:/data                     # SQLite 数据库文件
    restart: unless-stopped

  api:
    build: .
    command: uvicorn autores.server.main:app --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - data:/data                     # SQLite 数据库文件 + /data/reports 报告目录
    restart: unless-stopped

volumes:
  data:
