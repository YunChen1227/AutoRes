<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>性能测试报告助手</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --border: #e3e5e9;
    --text: #1f2328; --muted: #6b7280; --accent: #1f4e78;
    --user-bg: #1f4e78; --user-fg: #ffffff; --bot-bg: #f0f2f5;
    --status: #8a8f98; --err: #b42318; --report-bg: #eef4fb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--border);
    font-weight: 600; display: flex; align-items: center; gap: 10px;
  }
  header .dot { width: 9px; height: 9px; border-radius: 50%; background: #2ea043; }
  #chat {
    flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column;
    gap: 12px; max-width: 900px; width: 100%; margin: 0 auto;
  }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 12px; line-height: 1.5;
         white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: var(--user-bg); color: var(--user-fg);
              border-bottom-right-radius: 3px; }
  .msg.bot { align-self: flex-start; background: var(--bot-bg); border-bottom-left-radius: 3px; }
  .status { align-self: flex-start; color: var(--status); font-size: 13px; font-style: italic;
            padding: 2px 6px; }
  .error { align-self: flex-start; background: #fdecea; color: var(--err); padding: 10px 14px;
           border-radius: 10px; max-width: 78%; }
  .report {
    align-self: flex-start; background: var(--report-bg); border: 1px solid #cfe0f2;
    border-radius: 12px; padding: 14px; max-width: 78%;
  }
  .report h4 { margin: 0 0 8px; color: var(--accent); }
  .report .meta { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  .report a {
    display: inline-block; background: var(--accent); color: #fff; text-decoration: none;
    padding: 8px 16px; border-radius: 8px; font-size: 14px;
  }
  .report a:hover { opacity: 0.9; }
  footer {
    padding: 14px 20px; background: var(--panel); border-top: 1px solid var(--border);
  }
  .inputbar { max-width: 900px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  #input {
    flex: 1; resize: none; border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; font: inherit; max-height: 140px; min-height: 44px;
  }
  #send {
    background: var(--accent); color: #fff; border: none; border-radius: 10px;
    padding: 0 22px; height: 44px; font-size: 15px; cursor: pointer;
  }
  #send:disabled { opacity: 0.5; cursor: not-allowed; }
  .hint { text-align: center; color: var(--muted); font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>
  <header><span class="dot"></span>性能测试报告助手</header>
  <div id="chat">
    <div class="msg bot">你好！我可以帮你对比性能测试结果。例如：
「对比 GLM-4.5 在 H20 和 H800 上、TP=8 的吞吐」。</div>
  </div>
  <footer>
    <div class="inputbar">
      <textarea id="input" placeholder="描述你想对比的内容，回车发送 (Shift+回车换行)"></textarea>
      <button id="send">发送</button>
    </div>
    <div class="hint">会话不持久化，刷新即清空；报告链接有效期有限，请及时下载。</div>
  </footer>

<script>
(function () {
  const chat = document.getElementById("chat");
  const input = document.getElementById("input");
  const send = document.getElementById("send");

  // 会话 id：存 sessionStorage，刷新页面即新会话
  let sessionId = sessionStorage.getItem("autores_sid");
  if (!sessionId) {
    sessionId = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());
    sessionStorage.setItem("autores_sid", sessionId);
  }

  function el(cls, text) {
    const d = document.createElement("div");
    d.className = cls;
    if (text !== undefined) d.textContent = text;
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
    return d;
  }

  function addReport(ev) {
    const box = document.createElement("div");
    box.className = "report";
    const s = ev.summary || {};
    const cols = (s.columns || []).join("、");
    let notes = "";
    if (s.notes && s.notes.multi_framework) notes += " · 含多框架";
    if (s.notes && s.notes.multi_version) notes += " · 含多版本";
    box.innerHTML =
      '<h4>对比报告已生成</h4>' +
      '<div class="meta">共 ' + (s.num_runs || 0) + ' 次测试，' +
      (s.num_metric_rows || 0) + ' 行指标；对比列：' + (cols || '—') + notes + '</div>' +
      '<a href="' + ev.download_url + '" download>下载 Excel</a>';
    chat.appendChild(box);
    chat.scrollTop = chat.scrollHeight;
  }

  let botMsg = null;      // 当前累积的 bot 文本气泡
  let statusEl = null;    // 当前 status 提示（下一条消息到来时清除）

  function clearStatus() {
    if (statusEl) { statusEl.remove(); statusEl = null; }
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;
    el("msg user", text);
    input.value = "";
    input.style.height = "44px";
    send.disabled = true;
    botMsg = null;
    clearStatus();

    try {
      const resp = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, message: text }),
      });
      if (!resp.ok || !resp.body) {
        el("error", "请求失败（HTTP " + resp.status + "）");
        send.disabled = false;
        return;
      }
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const parts = buffer.split("\n\n");
        buffer = parts.pop();
        for (const part of parts) {
          const line = part.trim();
          if (!line.startsWith("data:")) continue;
          const payload = line.slice(5).trim();
          if (!payload) continue;
          let ev;
          try { ev = JSON.parse(payload); } catch (e) { continue; }
          handleEvent(ev);
        }
      }
    } catch (e) {
      el("error", "网络错误：" + e.message);
    } finally {
      send.disabled = false;
      clearStatus();
      input.focus();
    }
  }

  function handleEvent(ev) {
    switch (ev.type) {
      case "status":
        clearStatus();
        statusEl = el("status", ev.text || "处理中…");
        break;
      case "message":
        clearStatus();
        if (!botMsg) botMsg = el("msg bot", "");
        botMsg.textContent += ev.text || "";
        chat.scrollTop = chat.scrollHeight;
        break;
      case "report":
        clearStatus();
        addReport(ev);
        botMsg = null;
        break;
      case "error":
        clearStatus();
        el("error", ev.text || "出错了");
        botMsg = null;
        break;
      case "done":
        clearStatus();
        botMsg = null;
        break;
    }
  }

  send.addEventListener("click", sendMessage);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  input.addEventListener("input", function () {
    input.style.height = "44px";
    input.style.height = Math.min(input.scrollHeight, 140) + "px";
  });
  input.focus();
})();
</script>
</body>
</html>
